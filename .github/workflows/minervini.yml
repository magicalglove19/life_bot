name: minervini

on:
  schedule:
    # 05:20 KST (월~토) = 20:20 UTC (Sun~Fri, DOW 0-5)
    # 아침 브리핑(morning-stocks, 04:50 KST)과 같은 시간대에 도착한다.
    # 미국장 마감(16:00 ET = 20:00 UTC) 뒤 20분 — 예약 지연(1.6시간+)이 더해져 실제 실행은 충분히 늦다.
    - cron: '20 20 * * 0-5'
  workflow_dispatch:
  repository_dispatch:
    types: [minervini]

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Minervini screener
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/minervini_report.py
