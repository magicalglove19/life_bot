name: ma8-screener

on:
  schedule:
    # 09:05 KST (월~금) = 00:05 UTC — 이 시각에 '예약'하지만 실제 실행은 13시경이다.
    #
    # GitHub 예약은 슬롯마다 지연이 다르다 (실측: UTC 03~05시 4.3~4.6시간,
    # UTC 20~22시 1.6~2.3시간). 목표는 '13시경 실행 → 1분 뒤 도착 → 15:30 장 마감 전 확인'
    # 이므로, 지연 약 4시간을 역으로 계산해 예약을 앞당겨 둔다.
    # 지연이 달라지면 이 값을 다시 조정하거나 외부 트리거로 전환할 것.
    - cron: '5 0 * * 1-5'
  workflow_dispatch:
  repository_dispatch:
    types: [ma8-screener]

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run 8일선/정배열 screener
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/ma8_screener.py
