name: gangnam-kr

# 강남자리(데이짱 강남 기법) 한국 — 평일 14:30 KST 도착 목표 (장중 잠정 판정).
#
# ⚠️ 종가 전에 도착해야 의미가 있다(눌림 자리에서 사는 기법이다).
#    GitHub 예약은 이 레포 실측으로 1시간 23분 ~ 5시간 밀리므로 주 경로는
#    repository_dispatch 다. 맥의 launchd 가 평일 14:30 에 찌른다 (실행 ~2분).
#      설치:  ./scripts/local/install-trigger.sh gangnam-kr 14:30
#    맥이 꺼져 있으면 아래 백업 예약이 돌지만, 발송 창(13:50~15:20 KST)을
#    벗어나 도착하면 gangnam.py 가 스스로 건너뛴다.
#
# 조건을 모두 갖춘 종목이 없는 날은 아무 메시지도 보내지 않는다 (신호가 드물다).

on:
  schedule:
    - cron: '30 5 * * 1-5'      # 14:30 KST. 백업 — 창 안에 들어오면 발송, 아니면 건너뜀
  workflow_dispatch:
    inputs:
      force:
        description: '발송 창(13:50~15:20 KST)·요일 검사 무시하고 강제 발송'
        required: false
        default: true
        type: boolean
  repository_dispatch:
    types: [gangnam-kr]

permissions:
  contents: write            # 발송 기록(data/gangnam_state.json) 커밋

concurrency:
  group: gangnam-kr
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run 강남자리 (한국)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GANGNAM_FORCE: ${{ (github.event_name == 'workflow_dispatch' && inputs.force) && '1' || '0' }}
        run: python scripts/gangnam.py --market kr

      - name: 발송 기록 커밋
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/gangnam_state.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "gangnam-kr: 발송 기록 [skip ci]"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            git push
          fi
