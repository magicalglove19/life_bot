name: kid-english

on:
  # 예약 실행 제거 — GitHub 예약이 4~12시간씩 밀려서 자동 발송을 중단한다.
  # 수동 실행과 외부 트리거는 그대로 살아 있으므로 되살리려면 schedule만 다시 넣으면 된다.
  #   - cron: '6 8 * * 1-5'   # 17:06 KST (월~금)
  workflow_dispatch:
  repository_dispatch:
    types: [kid-english]

permissions:
  contents: write  # data/kid_vocab_week.json 커밋용

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run kid english
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python scripts/kid_english.py

      - name: Commit updated weekly vocab
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/kid_vocab_week.json || true
          if ! git diff --staged --quiet; then
            git commit -m "chore(data): update kid vocab week [skip ci]"
            git pull --rebase origin main || true
            git push
          else
            echo "변경 사항 없음"
          fi
