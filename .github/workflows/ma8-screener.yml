name: ma8-screener

on:
  # 예약 실행 제거 — GitHub 예약 지연으로 16시 넘어 도착해 장중 매수에 못 씀.
  # 맥의 유목민 스크리너(14:40 장중 미리보기, launchd)가 대신 보낸다.
  # 수동 실행과 외부 트리거는 그대로 살아 있으므로 되살리려면 schedule만 다시 넣으면 된다.
  #   - cron: '5 0 * * 1-5'   # 09:05 KST 예약 → 실제 13시~16시경 실행
  workflow_dispatch:
  repository_dispatch:
    types: [ma8-screener]

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run 8일선/정배열 screener
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/ma8_screener.py
