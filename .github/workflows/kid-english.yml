name: kid-english

on:
  schedule:
    # 19:00 KST (월~금) = 10:00 UTC (Mon~Fri, DOW 1-5)
    - cron: '6 10 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write  # data/kid_vocab_week.json 커밋용

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run kid english
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python scripts/kid_english.py

      - name: Commit updated weekly vocab
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/kid_vocab_week.json || true
          if ! git diff --staged --quiet; then
            git commit -m "chore(data): update kid vocab week [skip ci]"
            git pull --rebase origin main || true
            git push
          else
            echo "변경 사항 없음"
          fi
