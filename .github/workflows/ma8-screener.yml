name: ma8-screener

on:
  schedule:
    # 13:50 KST (월~금) = 04:50 UTC (Mon~Fri, DOW 1-5)
    # 스캔 5~10분 + GH Actions 지연 15분 여유 → 15:00 KST(장 마감 전) 이전 도착 목표
    - cron: '50 4 * * 1-5'
  workflow_dispatch:
  repository_dispatch:
    types: [ma8-screener]

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run 8일선/정배열 screener
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/ma8_screener.py
