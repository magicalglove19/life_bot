name: morning-stocks

on:
  schedule:
    # 04:30 KST (월~토) = 19:30 UTC (Sun~Fri, DOW 0-5)
    # 마감 전 예약이지만 GH Actions 지연(1.6시간+)으로 실제론 마감 뒤에 돈다. 아니면 대기 단계가 기다린다.
    # 토요일 실행분은 금요일 미국장 마감(토 새벽) 데이터를 다룸
    - cron: '30 19 * * 0-5'
  workflow_dispatch:  # 수동 실행 가능
  repository_dispatch:
    types: [morning-stocks]

permissions:
  contents: read
  actions: read             # 오늘 이미 보낸 실행이 있는지 조회

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 160        # 마감 대기 최대 120분 포함
    steps:
      - name: 미국장 마감 대기
        if: github.event_name != 'workflow_dispatch'
        run: |
          # 맥 트리거와 앞당긴 예약은 마감 전에 도착할 수 있다(겨울엔 마감이 한국 06:00). 그럴 땐 16:05 ET 까지 기다린다(서머타임 자동 반영).
          now=$(TZ=America/New_York date +%s)
          target=$(TZ=America/New_York date -d 'today 16:05' +%s)
          dow=$(TZ=America/New_York date +%u)
          if [ "$dow" -le 5 ] && [ "$now" -lt "$target" ] && [ $((target - now)) -le 7200 ]; then
            echo "미국장 마감 전 — $(( (target - now) / 60 ))분 대기"
            sleep $((target - now))
          fi

      - name: 오늘 이미 보냈는지 확인
        if: github.event_name != 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 맥 트리거(repository_dispatch)와 예약(schedule)이 둘 다 돈다. 예약은 몇 시간씩 밀려서
          # 보통 맥 트리거가 먼저 보낸다. 오늘(KST) 먼저 성공한 실행이 있으면 나머지 단계를 건너뛴다.
          since=$(date -u -d "$(TZ=Asia/Seoul date +%F) 00:00 +0900" +%Y-%m-%dT%H:%M:%SZ)
          n=$(gh run list -R "$GITHUB_REPOSITORY" -w "$GITHUB_WORKFLOW" --status success \
                --created ">=$since" --json databaseId \
                -q "[.[] | select(.databaseId != $GITHUB_RUN_ID)] | length")
          if [ "${n:-0}" -gt 0 ]; then
            echo "오늘 이미 성공한 실행이 있어 건너뜁니다."
            echo "SKIP=1" >> "$GITHUB_ENV"
          fi

      - uses: actions/checkout@v4
        if: env.SKIP != '1'

      - uses: actions/setup-python@v5
        if: env.SKIP != '1'
        with:
          python-version: '3.11'
          cache: pip

      - name: Install deps
        if: env.SKIP != '1'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run morning digest
        if: env.SKIP != '1'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/morning_digest.py
