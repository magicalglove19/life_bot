name: morning-stocks

on:
  schedule:
    # 05:00 KST (월~토) = 20:00 UTC (Sun~Fri, DOW 0-5)
    # 스캔 20분 + GH Actions 지연 30분 여유 → 06:00 KST 이전 도착 목표
    # 토요일 실행분은 금요일 미국장 마감(토 새벽) 데이터를 다룸
    - cron: '0 20 * * 0-5'
  workflow_dispatch:  # 수동 실행 가능
  repository_dispatch:
    types: [morning-stocks]

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run morning digest
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/morning_digest.py
