name: italian

on:
  schedule:
    # 07:00 KST (매일) = 22:00 UTC (전일)
    - cron: '3 22 * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [italian]

permissions:
  contents: write  # data/italian_history.json 커밋용

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run italian lesson
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python scripts/italian_lesson.py

      - name: Commit updated history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/italian_history.json || true
          if ! git diff --staged --quiet; then
            git commit -m "chore(data): update italian history [skip ci]"
            git pull --rebase origin main || true
            git push
          else
            echo "변경 사항 없음"
          fi
