name: kcg

# 강창권 상한가 후 눌림목 — 평일 15:00 KST 국내 스크리너.
#
# ⚠️ 시각이 중요한 작업이다. 장 마감(15:30) 전에 도착해야 종가로 살 수 있다.
#    그런데 GitHub 예약은 이 레포 실측으로 슬롯마다 1시간 23분 ~ 5시간 밀린다.
#    (20~23시 UTC 슬롯 83~153분 / 03시 UTC 슬롯 288~300분)
#    01시 UTC 슬롯은 표본이 없어 도착 시각을 장담할 수 없다.
#
#    → 주 경로는 repository_dispatch 다. 맥의 launchd 가 평일 15:00 정각에 찌른다.
#      설치:  ./scripts/local/install-trigger.sh kcg 15:00
#
#    아래 schedule 은 맥이 꺼져 있을 때를 위한 백업일 뿐이다. 엉뚱한 시각에
#    도착하면 kcg_report.py 가 발송 창(14:00~16:30 KST)을 벗어났다고 보고
#    스스로 건너뛴다. 장 초반 가격으로 "오늘 종가 매수"를 보내지 않기 위해서다.

on:
  schedule:
    - cron: '40 1 * * 1-5'      # 백업. 지연 폭이 커서 창 안에 들어오면 발송, 아니면 건너뜀
  workflow_dispatch:
    inputs:
      force:
        description: '발송 창(14:00~16:30 KST) 밖에서도 강제 발송'
        required: false
        default: true
        type: boolean
  repository_dispatch:
    types: [kcg]

permissions:
  contents: read

concurrency:
  group: kcg
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run 강창권 screener
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # 수동 실행(workflow_dispatch)은 기본으로 시간대 가드를 무시한다.
          KCG_FORCE: ${{ (github.event_name == 'workflow_dispatch' && inputs.force) && '1' || '0' }}
        run: python scripts/kcg_report.py
