name: morning-stocks

on:
  schedule:
    # 05:00 KST (월~금) = 20:00 UTC (Sun~Thu, DOW 0-4)
    # 스캔 20분 + GH Actions 지연 30분 여유 → 06:00 KST 이전 도착 목표
    - cron: '0 20 * * 0-4'
  workflow_dispatch:  # 수동 실행 가능

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run morning digest
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/morning_digest.py
