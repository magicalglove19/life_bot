name: minervini

on:
  schedule:
    # premarket(미국 Pre-market 급등주)과 같은 시각 — 18:00 KST (월~금) = 09:00 UTC
    # 같은 크론이라 두 메시지가 나란히 도착한다. premarket 시간을 바꾸면 이쪽도 같이 바꿀 것.
    - cron: '8 9 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Minervini screener
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/minervini_report.py
