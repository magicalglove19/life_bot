name: dupont-kr

# 듀퐁 1시간봉 박스 돌파 (국내, 관찰 단계) — 평일 10:01 ~ 15:01 KST 매시.
#
# 정각이 생명이다 (방금 마감된 1시간봉을 판정). 외부 스케줄러 없이 GitHub 만으로 맞춘다:
#   · 새벽 예약(05:00, 예비 07:00 KST)으로 작업을 미리 띄우고 scripts/dupont_day.py 가 정각까지 잠든다.
#     GitHub 예약은 이 레포 실측으로 1.5~5시간 늦게 시작되지만 새벽에 띄우면 장 전에 켜진다.
#   · 작업 하나는 6시간까지만 돌 수 있어서, 시간이 다 되면 workflow_dispatch(mode=loop)로
#     자기 자신을 다시 띄우고 끝낸다. concurrency 가 하나씩만 돌리므로 겹치지 않는다.
#   · 예비 예약이 뒤늦게 시작돼도 지나간 슬롯은 건너뛰고, 이미 판정한 봉은 장부로 걸러져 중복 발송이 없다.
#   · 공개 레포라 하루 종일 켜 두어도 Actions 사용 시간 비용이 없다.
#
# 한 번만 판정하려면 repository_dispatch(dupont-kr) 나 수동 실행(mode=once)을 쓴다.
#   ./scripts/local/trigger.sh dupont-kr

on:
  schedule:
    - cron: '0 20 * * 0-4'     # 05:00 KST 월~금
    - cron: '0 22 * * 0-4'     # 07:00 KST 예비 (앞 작업이 돌고 있으면 대기했다가 할 일 없이 끝남)
  workflow_dispatch:
    inputs:
      mode:
        description: 'loop = 오늘 남은 정각을 모두 / once = 지금 한 번'
        required: false
        default: once
        type: choice
        options: [once, loop]
      force:
        description: '(once) 실행 창·지난 봉 검사 무시'
        required: false
        default: false
        type: boolean
  repository_dispatch:
    types: [dupont-kr]

permissions:
  contents: write            # 가상 매매 장부(data/dupont_state.json) 커밋
  actions: write             # 루프 작업이 자기 자신을 다시 띄움

concurrency:
  group: dupont-kr
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      LOOP: ${{ (github.event_name == 'schedule' || inputs.mode == 'loop') && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install deps
        run: pip install yfinance pandas numpy requests

      # 어제까지의 야후 1시간봉은 하루 한 번만 받는다
      - name: KST 날짜
        id: day
        run: echo "day=$(TZ=Asia/Seoul date +%Y%m%d)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: scripts/cache/dupont
          key: dupont-yahoo-${{ steps.day.outputs.day }}

      - name: git 설정
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: 하루 루프 (정각마다 판정)
        if: env.LOOP == '1'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GH_TOKEN: ${{ github.token }}
        run: python scripts/dupont_day.py

      - name: 한 번 판정
        if: env.LOOP != '1'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DUPONT_FORCE: ${{ (github.event_name == 'workflow_dispatch' && inputs.force) && '1' || '0' }}
        run: python scripts/dupont_report.py

      - name: 장부 커밋
        if: always()
        run: |
          git add data/dupont_state.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "dupont-kr: 가상 매매 장부 [skip ci]"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            git push
          fi
