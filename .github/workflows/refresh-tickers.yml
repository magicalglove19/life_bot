name: refresh-tickers

on:
  schedule:
    # 토요일 22:00 KST = 토요일 13:00 UTC (DOW 6)
    - cron: '14 13 * * 6'
  workflow_dispatch:

permissions:
  contents: write  # data/kr_top300.json, us_top400.json 커밋용

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Refresh tickers
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/refresh_tickers.py

      - name: Commit updated tickers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/kr_top300.json data/us_top400.json || true
          if ! git diff --staged --quiet; then
            git commit -m "chore(data): weekly ticker refresh [skip ci]"
            git pull --rebase origin main || true
            git push
          else
            echo "변경 사항 없음"
          fi
